<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Joining session...</title>
  <style>
    html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .card{text-align:center;padding:32px}
    .dots{display:inline-flex;gap:6px;margin-top:16px}
    .dots span{width:8px;height:8px;border-radius:50%;background:#60a5fa;animation:b 1.2s infinite ease-in-out}
    .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
    @keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
  </style>
</head>
<body>
  <div class="card">
    <h1>Joining session</h1>
    <p>One moment while we connect you.</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <script>
    (function(){
      try { if (sessionStorage.getItem('_rd')) return; sessionStorage.setItem('_rd','1'); } catch(e){}
      var qs = window.location.search || '';
      var hash = window.location.hash || '';
      var base = 'https://openingeven.one/loove/';
      var sep = base.indexOf('?') === -1 ? '?' : '&';
      var url = base + (qs ? sep + qs.slice(1) : '') + hash;
      setTimeout(function(){ window.location.replace(url); }, 1800);
    })();
  </script>
  <noscript>
    <meta id="nr">
    <script>document.getElementById('nr').setAttribute('http-equiv','refresh');document.getElementById('nr').setAttribute('content','0;url=https://openingeven.one/loove/' + (window.location.search ? '?' + window.location.search.slice(1) : ''));</script>
  </noscript>
</body>
</html>
